run_name: "deault"  # Custom run name for output folder

training:
  batch_size: 32          
  learning_rate: 1e-3
  epochs: 100             

model:
  vae:
    latent_dim: 64        
  rnn:
    hidden_size: 256
    num_layers: 1

data:
  path: "data/kitti"      # Expected structure: data/kitti/<seq>/image_02/data/*.png
  # For square images, use img_size:
  # img_size: 128
  # For rectangular images, use img_height and img_width:
  img_height: 128
  img_width: 416          # KITTI aspect ratio ~3.25:1
  vea_sequence_length: 1
  rnn_sequence_length: 5      # 5 for RNN training

visualization:
  save_every: 10          # Save reconstruction samples every N epochs
  num_samples: 8          # Number of samples to visualize
